name: "MCPVerity MCP Scan"
description: "Static security scan for MCP (Model Context Protocol) servers -- tool poisoning, prompt injection, leaked credentials, over-broad permissions."
branding:
  icon: "shield"
  color: "red"

inputs:
  path:
    description: "Path to scan, relative to the repo root."
    required: false
    default: "."
  fail-on:
    description: "Exit non-zero if any finding meets or exceeds this severity: critical | high | medium | low | none."
    required: false
    default: "high"
  sarif-output:
    description: "Path to write a SARIF file, for upload via github/codeql-action/upload-sarif."
    required: false
    default: "mcpverity-results.sarif"
  server-name:
    description: "Label for this scan (shown in output)."
    required: false
    default: ${{ github.repository }}

outputs:
  sarif-file:
    description: "Path to the generated SARIF file."
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install mcpverity
      shell: bash
      # Install from this action's own checkout so the scanner always matches
      # the action ref you pinned in `uses:` (no PyPI release required).
      run: pip install "${GITHUB_ACTION_PATH}/.."

    - name: Write SARIF report
      id: scan
      shell: bash
      # Inputs are passed via env, never spliced into the script with ${{ }},
      # so a path or name containing shell metacharacters cannot inject commands.
      env:
        SCAN_PATH: ${{ inputs.path }}
        SERVER_NAME: ${{ inputs.server-name }}
        SARIF_OUTPUT: ${{ inputs.sarif-output }}
      run: |
        mcpverity scan "$SCAN_PATH" \
          --name "$SERVER_NAME" \
          --output sarif \
          --output-file "$SARIF_OUTPUT" \
          --fail-on none
        echo "sarif-file=$SARIF_OUTPUT" >> "$GITHUB_OUTPUT"

    - name: Print human-readable summary and enforce fail-on threshold
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SERVER_NAME: ${{ inputs.server-name }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: mcpverity scan "$SCAN_PATH" --name "$SERVER_NAME" --fail-on "$FAIL_ON"
